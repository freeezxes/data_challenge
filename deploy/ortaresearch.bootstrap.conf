# Only this domain is served here while DNS and the certificate are prepared.
server {
    listen 80;
    listen [::]:80;
    server_name ortaresearch.com www.ortaresearch.com;
    location /.well-known/acme-challenge/ {
        root /var/www/cqa-acme;
    }
    location / {
        default_type text/plain;
        return 503 "CQA deployment in progress. Please use HTTPS after setup completes.\n";
    }
}
