server {
    listen 80;
    listen [::]:80;
    server_name ortaresearch.com www.ortaresearch.com;
    location /.well-known/acme-challenge/ {
        root /var/www/cqa-acme;
    }
    location / {
        return 301 https://ortaresearch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ortaresearch.com www.ortaresearch.com;
    ssl_certificate /etc/letsencrypt/live/ortaresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortaresearch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        # Keys are request headers, never URLs. Do not log headers or bodies.
        proxy_cache off;
    }
}
