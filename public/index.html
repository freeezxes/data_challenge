<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CQA · Freedom Broker</title>
<link rel="icon" href="art/logo.png">
<link rel="preload" href="fonts/manrope-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/literata-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="cqa.css">
</head>
<body data-api="">
<header class="top">
  <a class="brand" href="#/"><img src="art/logo.png" alt="">CQA</a>
  <nav class="tabs" aria-label="Разделы">
    <a class="tab" href="#/" data-route="home">Главная</a>
    <a class="tab" href="#/queue" data-route="queue">Очередь</a>
    <a class="tab" href="#/appeals" data-route="appeals">Апелляции<span class="count" hidden></span></a>
    <a class="tab" href="#/checklists" data-route="checklists">Чек-листы</a>
    <a class="tab" href="#/copilot" data-route="copilot">Суфлёр</a>
    <a class="tab" href="#/operators" data-route="operators">Операторы</a>
    <a class="tab" href="#/analytics" data-route="analytics">Аналитика</a>
  </nav>
  <div class="role" role="group" aria-label="Роль">
    <button type="button" data-role="operator">Оператор</button>
    <button type="button" data-role="reviewer">Проверяющий</button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<script type="module" src="js/main.js"></script>

</html>
